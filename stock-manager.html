<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังพัสดุ — ระบบจัดการสต๊อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
    :root{
    --ink:#151821;
    --paper:#F3F2ED;
    --panel:#FFFFFF;
    --line:#E6E4DB;
    --line-soft:#EFEDE5;
    --navy:#151821;
    --navy-2:#20242F;
    --accent:#3D6B5C;
    --accent-2:#2E5548;
    --accent-soft:#E4EDE8;
    --amber:#C08A2E;
    --amber-soft:#F4E9D3;
    --green:#2E7D5B;
    --green-soft:#E1F0E6;
    --red:#B6472F;
    --red-soft:#F7E4DE;
    --muted:#7A7E8C;
    --muted-2:#9A9DA8;
    --radius:16px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(21,24,33,.04), 0 1px 1px rgba(21,24,33,.03);
    --shadow-md:0 8px 24px -8px rgba(21,24,33,.14), 0 2px 6px rgba(21,24,33,.05);
    --shadow-lg:0 20px 48px -12px rgba(21,24,33,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 90% -10%, rgba(61,107,92,.06), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Sora',sans-serif;letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent-2);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Layout ---------- */
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:236px;flex-shrink:0;
    background:linear-gradient(184deg,#171A23 0%, #12141B 100%);
    color:#E7E8ED;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    border-right:1px solid rgba(255,255,255,.04);
  }
  #sidebar .brand{
    padding:24px 20px 18px;font-size:16.5px;font-weight:700;
    letter-spacing:.01em;display:flex;align-items:center;gap:11px;
  }
  #sidebar .brand .mark{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,#4F8B76,#2E5548);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;font-family:'Sora',sans-serif;
    box-shadow:0 3px 10px rgba(46,85,72,.5);
  }
  #sidebar .brand .mark svg{width:17px;height:17px;}
  .setup .brand .mark svg{width:19px;height:19px;}
  .navlist{list-style:none;margin:6px 0 0;padding:6px 12px;flex:1;}
  .navlist li{margin-bottom:1px;}
  .navlist button{
    width:100%;text-align:left;background:none;border:none;color:#9EA2B3;
    padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;
    display:flex;align-items:center;gap:11px;transition:background .15s,color .15s;
    position:relative;
  }
  .navlist button svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
  .navlist button:hover{background:rgba(255,255,255,.05);color:#F0F1F5;}
  .navlist button.active{background:rgba(79,139,118,.16);color:#fff;}
  .navlist button.active svg{opacity:1;color:#6FBFA1;}
  .navlist button.active::before{
    content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
    background:#6FBFA1;border-radius:0 3px 3px 0;
  }
  #sidebar .foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:#71758A;}
  #sidebar .foot .status-ok{color:#6FBFA1;display:flex;align-items:center;gap:6px;}
  #sidebar .foot .status-ok::before{content:'';width:6px;height:6px;border-radius:50%;background:#6FBFA1;box-shadow:0 0 0 3px rgba(111,191,161,.18);}
  #sidebar .foot .status-bad{color:#D98F7C;}

  #main{flex:1;min-width:0;padding:32px 38px 60px;max-width:1220px;}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .pagehead h1{font-size:23px;margin:0;font-weight:700;}
  .pagehead p{margin:5px 0 0;color:var(--muted);font-size:13.5px;}

  .grid{display:grid;gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){#sidebar{width:64px;}#sidebar .brand span:not(.mark){display:none;}#sidebar .navlist button span.label{display:none;}#sidebar .navlist button{justify-content:center;}#sidebar .navlist button.active::before{left:0;}#main{padding:20px 16px;}.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);}
  .stat{display:flex;flex-direction:column;gap:10px;}
  .stat .icon{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);display:flex;align-items:center;justify-content:center;}
  .stat .icon svg{width:17px;height:17px;}
  .stat.warn .icon{background:var(--red-soft);color:var(--red);}
  .stat .k{font-size:12px;color:var(--muted);letter-spacing:.02em;}
  .stat .v{font-size:27px;font-weight:700;font-family:'Sora',sans-serif;letter-spacing:-.02em;}
  .stat .v.warn{color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFAF7;}
  th:first-child{border-top-left-radius:var(--radius);}
  th:last-child{border-top-right-radius:var(--radius);}
  td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:#FAFAF6;}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .tag.in{background:var(--green-soft);color:var(--green);}
  .tag.out{background:var(--red-soft);color:var(--red);}
  .tag.mv{background:var(--amber-soft);color:#8A661C;}
  .tag.adj{background:#EAEAF2;color:#464A5E;}

  .gauge{width:74px;height:7px;background:#EAE7DC;border-radius:8px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:9px;}
  .gauge > i{display:block;height:100%;background:linear-gradient(90deg,#4F8B76,#2E5548);border-radius:8px;}
  .gauge.low > i{background:linear-gradient(90deg,#C85F41,#B6472F);}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:600;color:var(--ink);transition:all .14s;box-shadow:var(--shadow-sm);}
  .btn:hover{border-color:#D2CFC2;transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn.primary{background:linear-gradient(180deg,#3D6B5C,#2E5548);color:#fff;border-color:#2A4E42;}
  .btn.primary:hover{background:linear-gradient(180deg,#457B69,#345F50);}
  .btn.amber{background:var(--amber);color:#3A2A05;border-color:var(--amber);}
  .btn.danger{color:var(--red);border-color:var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;}
  .field label{font-size:12.5px;font-weight:600;color:#41465A;}
  .field input,.field select,.field textarea{
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:#FEFDFB;transition:border-color .12s, box-shadow .12s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:140px;}

  .empty{padding:46px 20px;text-align:center;color:var(--muted);}
  .empty .ico{width:42px;height:42px;margin:0 auto 12px;border-radius:11px;background:#F1EFE6;display:flex;align-items:center;justify-content:center;color:var(--muted-2);}
  .empty .ico svg{width:20px;height:20px;}
  .empty .big{font-size:14.5px;color:var(--ink);font-weight:600;margin-bottom:4px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:99;}
  .toast{background:var(--navy);color:#fff;padding:12px 17px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:320px;display:flex;align-items:center;gap:9px;}
  .toast::before{content:'';width:7px;height:7px;border-radius:50%;background:#6FBFA1;flex-shrink:0;}
  .toast.err{background:#3A2420;}
  .toast.err::before{background:#E08A6E;}
  .toast.ok::before{background:#6FBFA1;}

  .modal-bg{position:fixed;inset:0;background:rgba(15,16,20,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--panel);border-radius:18px;padding:24px;max-width:460px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--shadow-lg);}
  .modal h3{margin:0 0 16px;font-size:16.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}

  .setup{max-width:540px;margin:56px auto;}
  .setup ol{padding-left:20px;font-size:13.5px;color:#41465A;line-height:1.75;}
  .setup code{background:#EAE7DC;padding:2px 7px;border-radius:5px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .badge-step{display:inline-flex;width:21px;height:21px;background:linear-gradient(135deg,#4F8B76,#2E5548);color:#fff;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:7px;}
  .setup .card{margin-bottom:16px;}

  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}
  .link{color:var(--accent-2);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:inherit;padding:0;}

  .searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .searchbar input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:var(--panel);}
  .searchbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   STOCK MANAGER — single-file app, persisted live to Google Sheets
   ========================================================================= */

const SHEET_NAMES = { items:'Items', warehouses:'Warehouses', tx:'Transactions' };
const HEADERS = {
  Items: ['SKU','Name','Category','Unit','ReorderPoint','Active'],
  Warehouses: ['Code','Name','Active'],
  Transactions: ['ID','Timestamp','Type','SKU','WarehouseCode','ToWarehouseCode','Qty','Note','Ref']
};

let state = {
  clientId:'', spreadsheetId:'', accessToken:'',
  connected:false, connecting:false,
  items:[], warehouses:[], tx:[],
  view:'dashboard',
  tokenClient:null,
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------------------- Icons ---------------------------- */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  receive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/></svg>',
  issue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V7"/><path d="m6 13 6-6 6 6"/><path d="M5 3h14"/></svg>',
  transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 3 4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="m7 21-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  items:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg>',
  warehouses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-7h6v7"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',
  activity:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>',
};

function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(kind?' '+kind:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3400);
}

/* ---------------------------- Persistent settings (non-sensitive) --------------------------- */
async function loadSettings(){
  try{
    const r = await window.storage.get('settings', false);
    if(r && r.value){
      const s = JSON.parse(r.value);
      state.clientId = s.clientId || '';
      state.spreadsheetId = s.spreadsheetId || '';
    }
  }catch(e){ /* no settings yet */ }
}
async function saveSettings(){
  try{
    await window.storage.set('settings', JSON.stringify({clientId:state.clientId, spreadsheetId:state.spreadsheetId}), false);
  }catch(e){ console.error('save settings failed', e); }
}

/* ---------------------------- Google OAuth ---------------------------- */
function ensureTokenClient(){
  if(state.tokenClient) return state.tokenClient;
  if(!window.google || !window.google.accounts){ return null; }
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.clientId,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: '' // set per-call
  });
  return state.tokenClient;
}

function requestToken(interactive){
  return new Promise((resolve, reject)=>{
    const tc = ensureTokenClient();
    if(!tc){ reject(new Error('Google Identity Services ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง')); return; }
    tc.callback = (resp)=>{
      if(resp.error){ reject(new Error(resp.error)); return; }
      state.accessToken = resp.access_token;
      resolve(resp.access_token);
    };
    tc.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}

/* ---------------------------- Sheets API ---------------------------- */
async function sheetsFetch(path, opts={}){
  const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+state.spreadsheetId+path, {
    ...opts,
    headers:{ 'Authorization':'Bearer '+state.accessToken, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(res.status===401){
    await requestToken(false);
    return sheetsFetch(path, opts);
  }
  if(!res.ok){
    const body = await res.text();
    throw new Error('Sheets API error ('+res.status+'): '+body.slice(0,200));
  }
  return res.json();
}

async function getSpreadsheetMeta(){
  return sheetsFetch('?fields=sheets.properties.title');
}

async function ensureSheetsExist(){
  const meta = await getSpreadsheetMeta();
  const existing = (meta.sheets||[]).map(s=>s.properties.title);
  const toAdd = Object.values(SHEET_NAMES).filter(n=>!existing.includes(n));
  if(toAdd.length){
    await sheetsFetch(':batchUpdate', {
      method:'POST',
      body: JSON.stringify({ requests: toAdd.map(title=>({ addSheet:{ properties:{ title } } })) })
    });
  }
  // ensure headers
  for(const key of ['Items','Warehouses','Transactions']){
    const r = await sheetsFetch('/values/'+encodeURIComponent(key+'!A1:Z1'));
    if(!r.values || !r.values.length){
      await sheetsFetch('/values/'+encodeURIComponent(key+'!A1')+'?valueInputOption=USER_ENTERED', {
        method:'PUT',
        body: JSON.stringify({ range:key+'!A1', values:[HEADERS[key]] })
      });
    }
  }
}

async function readAll(){
  const [i,w,t] = await Promise.all([
    sheetsFetch('/values/'+encodeURIComponent('Items!A2:Z10000')),
    sheetsFetch('/values/'+encodeURIComponent('Warehouses!A2:Z10000')),
    sheetsFetch('/values/'+encodeURIComponent('Transactions!A2:Z10000')),
  ]);
  state.items = (i.values||[]).map((r,idx)=>({
    rowNum: idx+2, sku:r[0]||'', name:r[1]||'', category:r[2]||'', unit:r[3]||'',
    reorderPoint: parseFloat(r[4]||'0')||0, active: (r[5]||'TRUE')!=='FALSE'
  })).filter(x=>x.sku);
  state.warehouses = (w.values||[]).map((r,idx)=>({
    rowNum: idx+2, code:r[0]||'', name:r[1]||'', active:(r[2]||'TRUE')!=='FALSE'
  })).filter(x=>x.code);
  state.tx = (t.values||[]).map((r,idx)=>({
    rowNum: idx+2, id:r[0]||'', ts:r[1]||'', type:r[2]||'', sku:r[3]||'', wh:r[4]||'',
    toWh:r[5]||'', qty: parseFloat(r[6]||'0')||0, note:r[7]||'', ref:r[8]||''
  })).filter(x=>x.id);
}

async function appendRow(sheetName, rowArray){
  const r = await sheetsFetch('/values/'+encodeURIComponent(sheetName+'!A1')+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
    method:'POST',
    body: JSON.stringify({ range:sheetName+'!A1', values:[rowArray] })
  });
  return r;
}
async function updateRow(sheetName, rowNum, rowArray){
  await sheetsFetch('/values/'+encodeURIComponent(sheetName+'!A'+rowNum)+'?valueInputOption=USER_ENTERED', {
    method:'PUT',
    body: JSON.stringify({ range:sheetName+'!A'+rowNum, values:[rowArray] })
  });
}

/* ---------------------------- Domain logic ---------------------------- */
function itemBySku(sku){ return state.items.find(i=>i.sku===sku); }
function whByCode(code){ return state.warehouses.find(w=>w.code===code); }

function stockOf(sku, whCode){
  let q = 0;
  for(const t of state.tx){
    if(t.sku!==sku) continue;
    if(t.type==='RECEIVE' && t.wh===whCode) q += t.qty;
    else if(t.type==='ISSUE' && t.wh===whCode) q -= t.qty;
    else if(t.type==='ADJUST' && t.wh===whCode) q += t.qty;
    else if(t.type==='TRANSFER'){
      if(t.wh===whCode) q -= t.qty;
      if(t.toWh===whCode) q += t.qty;
    }
  }
  return q;
}
function totalStock(sku){
  let q=0;
  for(const w of state.warehouses) q += stockOf(sku, w.code);
  return q;
}

async function addTransaction(type, sku, wh, toWh, qty, note, ref){
  const id = uid();
  const ts = new Date().toISOString();
  const row = [id, ts, type, sku, wh||'', toWh||'', qty, note||'', ref||''];
  await appendRow('Transactions', row);
  state.tx.push({ rowNum: state.tx.length+2, id, ts, type, sku, wh:wh||'', toWh:toWh||'', qty, note:note||'', ref:ref||'' });
}

async function doConnect(){
  const cid = document.getElementById('inClientId').value.trim();
  const sid = document.getElementById('inSpreadsheetId').value.trim();
  const err = document.getElementById('setupErr');
  err.textContent='';
  if(!cid || !sid){ err.textContent = 'กรุณากรอก Client ID และ Spreadsheet ID'; return; }
  state.clientId = cid; state.spreadsheetId = sid;
  state.connecting = true; renderSetup();
  try{
    await requestToken(true);
    await ensureSheetsExist();
    await readAll();
    state.connected = true;
    await saveSettings();
    toast('เชื่อมต่อสำเร็จ','ok');
    render();
  }catch(e){
    state.connecting = false;
    renderSetup();
    document.getElementById('setupErr').textContent = 'เชื่อมต่อไม่สำเร็จ: ' + e.message;
  }
}

  if(!item) return;
  const m = openModal(`
    <h3>แก้ไขสินค้า</h3>
    <form id="fItem">
      <div class="row"><div class="field"><label>SKU</label><input value="${item.sku}" disabled></div><div class="field"><label>หน่วยนับ</label><input name="unit" required value="${item.unit}"></div></div>
      <div class="field"><label>ชื่อสินค้า</label><input name="name" required value="${item.name}"></div>
      <div class="row"><div class="field"><label>หมวดหมู่</label><input name="category" value="${item.category||''}"></div><div class="field"><label>จุดสั่งซื้อขั้นต่ำ</label><input name="reorderPoint" type="number" value="${item.reorderPoint}" min="0" step="any"></div></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="delM">ลบสินค้า</button>
        <button type="button" class="btn" id="cancelM">ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  `);
  m.querySelector('#cancelM').onclick = ()=>m.remove();
  m.querySelector('#delM').onclick = async ()=>{
    if(!confirm('ยืนยันลบสินค้านี้? (จะซ่อนจากระบบ ประวัติเดิมยังอยู่ใน Sheet)')) return;
    item.active=false;
    await updateRow('Items', item.rowNum, [item.sku,item.name,item.category,item.unit,item.reorderPoint,'FALSE']);
    state.items = state.items.filter(i=>i.sku!==sku);
    m.remove(); toast('ลบสินค้าแล้ว','ok'); render();
  };
  m.querySelector('#fItem').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    item.name=f.get('name'); item.category=f.get('category')||''; item.unit=f.get('unit'); item.reorderPoint=parseFloat(f.get('reorderPoint')||'0')||0;
    await updateRow('Items', item.rowNum, [item.sku,item.name,item.category,item.unit,item.reorderPoint,'TRUE']);
    m.remove(); toast('บันทึกแล้ว','ok'); render();
  };
}

function modalAddWh(){
  const m = openModal(`
    <h3>เพิ่มคลังสินค้า</h3>
    <form id="fWh">
      <div class="field"><label>รหัสคลัง</label><input name="code" required placeholder="เช่น WH1"></div>
      <div class="field"><label>ชื่อคลัง</label><input name="name" required placeholder="เช่น คลังหลัก สาขาสีลม"></div>
      <div class="modal-actions"><button type="button" class="btn" id="cancelM">ยกเลิก</button><button type="submit" class="btn primary">บันทึก</button></div>
    </form>
  `);
  m.querySelector('#cancelM').onclick = ()=>m.remove();
  m.querySelector('#fWh').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const code = f.get('code').trim();
    if(whByCode(code)){ alert('รหัสคลังนี้มีอยู่แล้ว'); return; }
    await appendRow('Warehouses', [code, f.get('name'), 'TRUE']);
    state.warehouses.push({ rowNum: state.warehouses.length+2, code, name:f.get('name'), active:true });
    m.remove(); toast('เพิ่มคลังแล้ว','ok'); render();
  };
}

function modalEditWh(code){
  const w = whByCode(code);
  if(!w) return;
  const m = openModal(`
    <h3>แก้ไขคลังสินค้า</h3>
    <form id="fWh">
      <div class="field"><label>รหัสคลัง</label><input value="${w.code}" disabled></div>
      <div class="field"><label>ชื่อคลัง</label><input name="name" required value="${w.name}"></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="delM">ลบคลัง</button>
        <button type="button" class="btn" id="cancelM">ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  `);
  m.querySelector('#cancelM').onclick = ()=>m.remove();
  m.querySelector('#delM').onclick = async ()=>{
    if(!confirm('ยืนยันลบคลังนี้?')) return;
    await updateRow('Warehouses', w.rowNum, [w.code,w.name,'FALSE']);
    state.warehouses = state.warehouses.filter(x=>x.code!==code);
    m.remove(); toast('ลบคลังแล้ว','ok'); render();
  };
  m.querySelector('#fWh').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    w.name = f.get('name');
    await updateRow('Warehouses', w.rowNum, [w.code,w.name,'TRUE']);
    m.remove(); toast('บันทึกแล้ว','ok'); render();
  };
}

/* ---------------------------- Event binding ---------------------------- */
function bindViewEvents(){
  const btnSync = document.getElementById('btnSync');
  if(btnSync) btnSync.onclick = async ()=>{ btnSync.disabled=true; btnSync.textContent='กำลังซิงก์…'; try{ await readAll(); toast('ซิงก์ข้อมูลล่าสุดแล้ว','ok'); }catch(e){ toast('ซิงก์ไม่สำเร็จ: '+e.message,'err'); } render(); };

  const btnResync = document.getElementById('btnResync');
  if(btnResync) btnResync.onclick = async ()=>{ try{ await readAll(); toast('ซิงก์แล้ว','ok'); }catch(e){ toast('ผิดพลาด: '+e.message,'err'); } render(); };

  const btnDisc = document.getElementById('btnDisconnect');
  if(btnDisc) btnDisc.onclick = async ()=>{
    if(!confirm('ตัดการเชื่อมต่อ? ข้อมูลจะยังอยู่ใน Google Sheet เดิม')) return;
    state.connected=false; state.accessToken=''; state.clientId=''; state.spreadsheetId='';
    await saveSettings();
    render();
  };

  const btnAddItem = document.getElementById('btnAddItem');
  if(btnAddItem) btnAddItem.onclick = modalAddItem;
  const btnAddWh = document.getElementById('btnAddWh');
  if(btnAddWh) btnAddWh.onclick = modalAddWh;

  document.querySelectorAll('[data-edit-item]').forEach(b=> b.onclick = ()=> modalEditItem(b.dataset.editItem));
  document.querySelectorAll('[data-edit-wh]').forEach(b=> b.onclick = ()=> modalEditWh(b.dataset.editWh));
  document.querySelectorAll('[data-void]').forEach(b=> b.onclick = ()=>{
    const tx = state.tx.find(t=>t.id===b.dataset.void);
    if(tx) voidTransactionFixed(tx);
  });

  const stockSearch = document.getElementById('stockSearch');
  if(stockSearch) stockSearch.oninput = ()=>{
    const q = stockSearch.value.toLowerCase();
    document.querySelectorAll('#stockBody tr[data-name]').forEach(tr=>{
      tr.style.display = tr.dataset.name.includes(q) ? '' : 'none';
    });
  };

  const moveForm = document.getElementById('moveForm');
  if(moveForm) moveForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const type = state.view==='receive' ? 'RECEIVE' : 'ISSUE';
    const qty = parseFloat(f.get('qty'));
    const sku = f.get('sku'), wh = f.get('wh');
    if(type==='ISSUE'){
      const avail = stockOf(sku, wh);
      if(qty > avail){ if(!confirm(`คงเหลือในคลังนี้เพียง ${avail} หน่วย ต้องการเบิก ${qty} หน่วยหรือไม่? (สต๊อกจะติดลบ)`)) return; }
    }
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='กำลังบันทึก…';
    try{
      await addTransaction(type, sku, wh, '', qty, f.get('note')||'');
      toast(type==='RECEIVE'?'บันทึกรับเข้าแล้ว':'บันทึกเบิกออกแล้ว','ok');
      e.target.reset();
    }catch(err){ toast('บันทึกไม่สำเร็จ: '+err.message,'err'); }
    render();
  };

  const transferForm = document.getElementById('transferForm');
  if(transferForm) transferForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const sku=f.get('sku'), wh=f.get('wh'), toWh=f.get('toWh'), qty=parseFloat(f.get('qty'));
    if(wh===toWh){ alert('คลังต้นทางและปลายทางต้องไม่ใช่คลังเดียวกัน'); return; }
    const avail = stockOf(sku, wh);
    if(qty > avail){ if(!confirm(`คงเหลือในคลังต้นทางเพียง ${avail} หน่วย ต้องการโอน ${qty} หน่วยหรือไม่?`)) return; }
    try{
      await addTransaction('TRANSFER', sku, wh, toWh, qty, f.get('note')||'');
      toast('บันทึกการโอนย้ายแล้ว','ok');
      e.target.reset();
    }catch(err){ toast('บันทึกไม่สำเร็จ: '+err.message,'err'); }
    render();
  };
}

async function voidTransactionFixed(tx){
  if(!confirm('ยกเลิกรายการนี้? ระบบจะบันทึกรายการกลับด้านเพื่อหักล้างยอด')) return;
  const note = 'ยกเลิกรายการ '+tx.id;
  try{
    if(tx.type==='RECEIVE') await addTransaction('ADJUST', tx.sku, tx.wh, '', -tx.qty, note, tx.id);
    else if(tx.type==='ISSUE') await addTransaction('ADJUST', tx.sku, tx.wh, '', tx.qty, note, tx.id);
    else if(tx.type==='ADJUST') await addTransaction('ADJUST', tx.sku, tx.wh, '', -tx.qty, note, tx.id);
    else if(tx.type==='TRANSFER') await addTransaction('TRANSFER', tx.sku, tx.toWh, tx.wh, tx.qty, note, tx.id);
    toast('ยกเลิกรายการแล้ว','ok');
  }catch(err){ toast('ยกเลิกไม่สำเร็จ: '+err.message,'err'); }
  render();
}

/* ---------------------------- Boot ---------------------------- */
(async function boot(){
  await loadSettings();
  render();
  if(state.clientId && state.spreadsheetId){
    // attempt silent reconnect
    state.connecting = true; renderSetup();
    try{
      await requestToken(false).catch(()=>requestToken(true));
      await ensureSheetsExist();
      await readAll();
      state.connected = true;
      render();
    }catch(e){
      state.connecting = false;
      render();
    }
  }
})();
</script>
